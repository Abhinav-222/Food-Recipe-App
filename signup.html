<!DOCTYPE html>
<html>

<head>

    <title>Sign Up - Food Recipe App</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

    <header>

        <div class="logo">

            <span>🍳</span>

            <h1>Food Recipe App</h1>

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="index.html#recipes">Recipes</a>
            <a href="index.html#categories">Categories</a>
            <a href="saved.html">Saved Recipes</a>
            <a href="index.html#about">About</a>

        </nav>

        <div class="user-area">

            <a href="signin.html" class="signin">
                Sign In
            </a>

        </div>

    </header>


    <section class="auth-section">

        <div class="auth-box">

            <div class="auth-icon">
                🍳
            </div>

            <h2>Create Account</h2>

            <p>
                Join Food Recipe App and save your favorite recipes.
            </p>


            <form onsubmit="event.preventDefault(); signup()">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('signupPassword', this)"
                    >
                        👁
                    </button>

                </div>


                <label>Confirm Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="signin.html">
                    Sign In
                </a>

            </p>

        </div>

    </section>


    <footer>

        <p>Food Recipe App</p>

    </footer>


    <script src="JS/auth.js"></script>

</body>

</html>
