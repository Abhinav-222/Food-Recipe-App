<!DOCTYPE html>
<html>

<head>

    <title>Sign In - Food Recipe App</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

    <header>

        <div class="logo">

            <span>🍳</span>

            <h1>Food Recipe App</h1>

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="index.html#recipes">Recipes</a>
            <a href="index.html#categories">Categories</a>
            <a href="saved.html">Saved Recipes</a>
            <a href="about.html">About</a>

        </nav>

        <div class="user-area">

            <a href="signup.html" class="signin">
                Sign Up
            </a>

        </div>

    </header>


    <section class="auth-section">

        <div class="auth-box">

            <div class="auth-icon">
                🍳
            </div>

            <h2>Welcome Back</h2>

            <p>
                Sign in to access your saved recipes.
            </p>


            <form onsubmit="event.preventDefault(); signin()">

                <label>Email</label>

                <input
                    type="email"
                    id="signinEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="signinPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('signinPassword', this)"
                    >
                        👁
                    </button>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <footer>

        <p>Food Recipe App</p>

    </footer>


    <script src="JS/auth.js"></script>

</body>

</html>
