<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard - Food Recipe App</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>


<body>


<header>

    <div class="logo">

        <span>🍳</span>

        <h1>Food Recipe App</h1>

    </div>


    <nav>

        <a href="admin.html" class="active">
            Dashboard
        </a>

        <a href="index.html">
            Website
        </a>

    </nav>


    <div class="user-area">

        <span class="welcome-user">
            👑 Administrator
        </span>

        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>



<main class="admin-page">


    <div class="admin-heading">

        <div>

            <p class="small-title">
                ADMIN PANEL
            </p>

            <h2>
                Welcome, Administrator
            </h2>

            <p>
                Manage your Food Recipe App from here.
            </p>

        </div>

    </div>



    <section class="admin-stats">

        <div class="admin-card">

            <div class="admin-card-icon">
                👥
            </div>

            <h3 id="userCount">
                0
            </h3>

            <p>
                Registered Users
            </p>

        </div>

    </section>



    <section class="admin-content">


        <div class="admin-panel">

            <h2>
                User Management
            </h2>

            <p>
                Click on a user to view their profile.
            </p>


            <div id="userList"></div>

        </div>



        <div class="admin-panel">

            <h2>
                Quick Actions
            </h2>


            <div class="admin-actions">

                <a
                    href="index.html"
                    class="admin-action"
                >
                    🍴 View Website
                </a>


                <a
                    href="saved.html"
                    class="admin-action"
                >
                    ❤️ Saved Recipes
                </a>

            </div>

        </div>


    </section>


</main>



<footer>

    <p>
        Food Recipe App
    </p>

</footer>



<script src="JS/auth.js"></script>


<script>


function checkAdmin() {

    let loggedInUser =
        JSON.parse(
            localStorage.getItem("loggedInUser")
        );


    if (
        !loggedInUser ||
        loggedInUser.role !== "admin"
    ) {

        window.location.href =
            "signin.html";

        return;

    }


    displayUsers();

}



function displayUsers() {

    let users =
        JSON.parse(
            localStorage.getItem("users")
        ) || [];


    document.getElementById(
        "userCount"
    ).textContent =
        users.length;


    let userList =
        document.getElementById(
            "userList"
        );


    if (users.length === 0) {

        userList.innerHTML = `

            <div class="no-users">

                No registered users yet.

            </div>

        `;

        return;

    }


    userList.innerHTML = "";


    users.forEach(
        function(user, index) {


            let row =
                document.createElement(
                    "div"
                );


            row.className =
                "user-row";


            row.innerHTML = `

                <div class="user-info">

                    <div class="user-avatar">
                        👤
                    </div>

                    <div>

                        <h3>
                            ${user.name}
                        </h3>

                        <p>
                            ${user.email}
                        </p>

                    </div>

                </div>


                <div class="user-actions">

                    <button
                        class="view-user"
                        onclick="viewUser(${index})"
                    >
                        View Details
                    </button>


                    <button
                        class="delete-user"
                        onclick="deleteUser(${index})"
                    >
                        Delete
                    </button>

                </div>

            `;


            userList.appendChild(row);

        }
    );

}



function viewUser(index) {

    window.location.href =
        "user-profile.html?id=" +
        index;

}



function deleteUser(index) {

    let users =
        JSON.parse(
            localStorage.getItem("users")
        ) || [];


    if (
        confirm(
            "Are you sure you want to delete this user?"
        )
    ) {

        users.splice(index, 1);


        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );


        displayUsers();

    }

}



checkAdmin();


</script>


</body>

</html>
